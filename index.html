<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Smart Study Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blobs"></div>
    
    <main class="glass-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <h1 class="logo">NEXUS</h1>
            <ul>
                <li class="active">Dashboard</li>
                <li>Resources</li>
                <li>Settings</li>
            </ul>
        </nav>

        <!-- Main Content -->
        <section class="content">
            <header>
                <h2>Welcome back, Student</h2>
                <p>Track your progress and stay focused.</p>
            </header>

            <div class="dashboard-grid">
                <!-- Timer Card -->
                <div class="card timer-card">
                    <h3>Focus Timer</h3>
                    <div class="timer-display" id="timer">25:00</div>
                    <button onclick="toggleTimer()" id="timerBtn">Start Session</button>
                </div>

                <!-- Task Card -->
                <div class="card tasks-card">
                    <h3>Today's Tasks</h3>
                    <div class="task-input">
                        <input type="text" id="taskIn" placeholder="New task...">
                        <button onclick="addTask()">+</button>
                    </div>
                    <ul id="taskList"></ul>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
